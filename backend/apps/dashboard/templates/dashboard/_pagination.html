{% if page.paginator.count %}
<div class="pagination">
  <span class="pagination-info">
    {{ page.start_index }} – {{ page.end_index }} of {{ page.paginator.count }} items
  </span>
  <div class="pagination-controls">
    {% if page.has_previous %}
      <a class="btn btn--ghost" href="?page={{ page.previous_page_number }}{{ base_qs }}">Previous</a>
    {% else %}
      <span class="btn btn--ghost is-disabled">Previous</span>
    {% endif %}
    {% if page.has_next %}
      <a class="btn btn--ghost" href="?page={{ page.next_page_number }}{{ base_qs }}">Next</a>
    {% else %}
      <span class="btn btn--ghost is-disabled">Next</span>
    {% endif %}
  </div>
</div>
{% endif %}
